<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Etiqueta WMS
  </title>


  <script
    src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js">
  </script>


  <style>

    * {
      box-sizing:
        border-box;
    }


    body {

      margin:
        0;

      padding:
        20px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f3f4f6;

    }


    .painel {

      max-width:
        600px;

      margin:
        0 auto 20px;

      background:
        white;

      padding:
        20px;

      border-radius:
        14px;

    }


    .campo {

      margin-bottom:
        12px;

    }


    .campo label {

      display:
        block;

      font-size:
        13px;

      font-weight:
        bold;

      margin-bottom:
        5px;

    }


    .campo input {

      width:
        100%;

      height:
        45px;

      border:
        2px solid
        #d1d5db;

      border-radius:
        9px;

      padding:
        0 10px;

      font-size:
        16px;

    }


    .botao {

      width:
        100%;

      height:
        50px;

      margin-top:
        8px;

      border:
        none;

      border-radius:
        10px;

      background:
        #2563eb;

      color:
        white;

      font-size:
        16px;

      font-weight:
        bold;

    }


    .etiqueta {

      width:
        100%;

      max-width:
        550px;

      margin:
        auto;

      padding:
        25px;

      background:
        white;

      border:
        1px solid
        #d1d5db;

      text-align:
        center;

    }


    .empresa {

      font-size:
        20px;

      font-weight:
        bold;

    }


    .tipo {

      font-size:
        13px;

      margin-top:
        7px;

      color:
        #6b7280;

    }


    .codigo {

      font-size:
        30px;

      font-weight:
        bold;

      margin:
        12px 0;

      letter-spacing:
        2px;

    }


    .barcode {

      width:
        100%;

      max-width:
        450px;

      height:
        110px;

    }


    .info {

      margin-top:
        15px;

      text-align:
        left;

      font-size:
        14px;

      line-height:
        1.6;

    }


    .linha {

      display:
        flex;

      justify-content:
        space-between;

      border-bottom:
        1px solid
        #e5e7eb;

    }


    .valor {

      font-weight:
        bold;

    }


    @media print {

      body {

        background:
          white;

        padding:
          0;

      }


      .nao-imprimir {

        display:
          none !important;

      }


      .etiqueta {

        border:
          none;

      }

    }

  </style>

</head>


<body>


<div
  class="painel nao-imprimir"
>

  <div class="campo">

    <label>
      Código do pallet
    </label>

    <input
      id="codigo"
      placeholder="PL000010"
    >

  </div>


  <div class="campo">

    <label>
      Produto
    </label>

    <input
      id="produto"
    >

  </div>


  <div class="campo">

    <label>
      SKU
    </label>

    <input
      id="sku"
    >

  </div>


  <div class="campo">

    <label>
      Lote
    </label>

    <input
      id="lote"
    >

  </div>


  <div class="campo">

    <label>
      Quantidade
    </label>

    <input
      id="quantidade"
    >

  </div>


  <div class="campo">

    <label>
      Peso
    </label>

    <input
      id="peso"
    >

  </div>


  <button
    class="botao"
    onclick="gerarEtiqueta()"
  >
    GERAR ETIQUETA
  </button>


  <button
    class="botao"
    onclick="window.print()"
  >
    IMPRIMIR
  </button>

</div>


<div
  class="etiqueta"
>

  <div class="empresa">
    SABOR DE FRANCE
  </div>


  <div class="tipo">
    PALLET DE PRODUÇÃO
  </div>


  <div
    id="codigoVisual"
    class="codigo"
  >
    PL000010
  </div>


  <svg
    id="barcode"
    class="barcode"
  ></svg>


  <div class="info">

    <div class="linha">

      <span>
        Produto:
      </span>

      <span
        id="produtoVisual"
        class="valor"
      ></span>

    </div>


    <div class="linha">

      <span>
        SKU:
      </span>

      <span
        id="skuVisual"
        class="valor"
      ></span>

    </div>


    <div class="linha">

      <span>
        Lote:
      </span>

      <span
        id="loteVisual"
        class="valor"
      ></span>

    </div>


    <div class="linha">

      <span>
        Quantidade:
      </span>

      <span
        id="quantidadeVisual"
        class="valor"
      ></span>

    </div>


    <div class="linha">

      <span>
        Peso:
      </span>

      <span
        id="pesoVisual"
        class="valor"
      ></span>

    </div>

  </div>

</div>


<script>


/* ==========================================================
   PARÂMETROS DA URL
   ========================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const codigoURL =
  params.get(
    "codigo"
  );


/* ==========================================================
   GERAR
   ========================================================== */

function gerarEtiqueta() {

  const codigo =
    document
      .getElementById(
        "codigo"
      )
      .value
      .trim()
      .toUpperCase();


  const produto =
    document
      .getElementById(
        "produto"
      )
      .value
      .trim();


  const sku =
    document
      .getElementById(
        "sku"
      )
      .value
      .trim();


  const lote =
    document
      .getElementById(
        "lote"
      )
      .value
      .trim();


  const quantidade =
    document
      .getElementById(
        "quantidade"
      )
      .value
      .trim();


  const peso =
    document
      .getElementById(
        "peso"
      )
      .value
      .trim();


  if (
    !codigo
  ) {

    alert(
      "Informe o código do pallet."
    );

    return;

  }


  document
    .getElementById(
      "codigoVisual"
    )
    .textContent =
    codigo;


  document
    .getElementById(
      "produtoVisual"
    )
    .textContent =
    produto;


  document
    .getElementById(
      "skuVisual"
    )
    .textContent =
    sku;


  document
    .getElementById(
      "loteVisual"
    )
    .textContent =
    lote;


  document
    .getElementById(
      "quantidadeVisual"
    )
    .textContent =
    quantidade;


  document
    .getElementById(
      "pesoVisual"
    )
    .textContent =
    peso;


  JsBarcode(

    "#barcode",

    codigo,

    {

      format:
        "CODE128",

      displayValue:
        true,

      text:
        codigo,

      fontSize:
        20,

      fontOptions:
        "bold",

      height:
        100,

      width:
        2,

      margin:
        10

    }

  );

}


/* ==========================================================
   ABRIR
   ========================================================== */

window.addEventListener(
  "load",
  function() {

    if (
      codigoURL
    ) {

      document
        .getElementById(
          "codigo"
        )
        .value =
        codigoURL;

    }


    gerarEtiqueta();

  }
);

</script>


</body>

</html>
