<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>WMS Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .description {
      color: #6b7280;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      min-height: 300px;
      border-radius: 14px;
      overflow: hidden;
      background: #111827;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: center;
      font-size: 14px;
    }

    .result {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #ecfdf5;
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }

    .button {
      width: 100%;
      height: 52px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:active {
      transform: scale(0.99);
    }

  </style>

</head>


<body>

  <div class="app">

    <div class="title">
      WMS Scanner
    </div>

    <div class="description">
      Aponte a câmera para o código de barras do pallet.
    </div>

    <div id="reader"></div>

    <div
      id="status"
      class="status"
    >
      Preparando scanner...
    </div>

    <div
      id="resultado"
      class="result"
      style="display:none"
    ></div>

    <button
      id="cameraButton"
      class="button"
      type="button"
      onclick="iniciarScanner()"
    >
      INICIAR CÂMERA
    </button>

  </div>


  <script>

    // ==========================================================
    // VARIÁVEIS
    // ==========================================================

    let scanner = null;

    let targetOrigin = null;

    let scannerIniciado = false;

    let codigoJaEnviado = false;


    // ==========================================================
    // LÊ targetOrigin DA URL
    // ==========================================================

    const params =
      new URLSearchParams(
        window.location.search
      );


    targetOrigin =
      params.get(
        "targetOrigin"
      );


    // ==========================================================
    // VALIDA ORIGEM
    // ==========================================================

    function origemValida() {

      if (!targetOrigin) {

        return false;

      }


      return (

        targetOrigin === "*"

        ||

        targetOrigin ===
          "https://script.google.com"

        ||

        targetOrigin ===
          "https://script.googleusercontent.com"

      );

    }


    // ==========================================================
    // STATUS
    // ==========================================================

    function atualizarStatus(
      mensagem
    ) {

      document
        .getElementById(
          "status"
        )
        .textContent =
        mensagem;

    }


    // ==========================================================
    // INICIAR SCANNER
    // ==========================================================

    function iniciarScanner() {

      if (
        scannerIniciado
      ) {

        return;

      }


      if (
        !origemValida()
      ) {

        atualizarStatus(
          "Abra este scanner pelo WMS."
        );

        console.error(
          "targetOrigin inválido:",
          targetOrigin
        );

        return;

      }


      atualizarStatus(
        "Solicitando acesso à câmera..."
      );


      const reader =
        document.getElementById(
          "reader"
        );


      reader.innerHTML = "";


      codigoJaEnviado =
        false;


      scanner =
        new Html5Qrcode(
          "reader"
        );


      const config = {

        fps: 10,

        qrbox: {
          width: 300,
          height: 120
        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats
            .CODE_128

        ]

      };


      scanner
        .start(

          {
            facingMode:
              "environment"
          },

          config,

          function(
            decodedText
          ) {

            processarCodigo(
              decodedText
            );

          },

          function(
            errorMessage
          ) {

            // Falhas durante a busca
            // são normais e não serão exibidas.

          }

        )

        .then(
          function() {

            scannerIniciado =
              true;


            atualizarStatus(
              "Aponte a câmera para o código."
            );

          }
        )

        .catch(
          function(
            erro
          ) {

            scannerIniciado =
              false;


            console.error(
              "Erro ao iniciar câmera:",
              erro
            );


            atualizarStatus(
              "Erro ao acessar a câmera."
            );

          }
        );

    }


    // ==========================================================
    // PROCESSAR CÓDIGO
    // ==========================================================

    function processarCodigo(
      codigo
    ) {

      if (
        codigoJaEnviado
      ) {

        return;

      }


      codigo =
        String(
          codigo
        )
        .trim()
        .toUpperCase();


      if (!codigo) {

        return;

      }


      codigoJaEnviado =
        true;


      document
        .getElementById(
          "resultado"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "resultado"
        )
        .textContent =
        codigo;


      atualizarStatus(
        "Código identificado!"
      );


      enviarCodigoParaWMS(
        codigo
      );

    }


    // ==========================================================
    // ENVIAR PARA O WMS
    // ==========================================================

    function enviarCodigoParaWMS(
      codigo
    ) {

      if (
        !window.opener
      ) {

        atualizarStatus(
          "Janela principal do WMS não encontrada."
        );


        codigoJaEnviado =
          false;


        return;

      }


      try {

        window.opener.postMessage(

          {

            type:
              "WMS_BARCODE",

            codigo:
              codigo

          },

          targetOrigin

        );


        atualizarStatus(
          "Código enviado ao WMS."
        );


        pararScanner();


        setTimeout(
          function() {

            window.close();

          },
          700
        );


      } catch (
        erro
      ) {

        console.error(
          "Erro ao enviar código:",
          erro
        );


        atualizarStatus(
          "Erro ao enviar código ao WMS."
        );


        codigoJaEnviado =
          false;

      }

    }


    // ==========================================================
    // PARAR SCANNER
    // ==========================================================

    function pararScanner() {

      if (!scanner) {

        return;

      }


      scanner
        .stop()
        .then(
          function() {

            try {

              scanner.clear();

            } catch (
              erro
            ) {

              console.log(
                "Scanner limpo."
              );

            }


            scannerIniciado =
              false;

          }
        )
        .catch(
          function(
            erro
          ) {

            console.log(
              "Erro ao parar scanner:",
              erro
            );

          }
        );

    }


    // ==========================================================
    // INICIALIZAÇÃO
    // ==========================================================

    window.addEventListener(
      "load",
      function() {

        if (
          origemValida()
        ) {

          atualizarStatus(
            "Scanner pronto."
          );

        } else {

          atualizarStatus(
            "Abra este scanner pelo WMS."
          );

        }

      }
    );

  </script>

</body>

</html>
