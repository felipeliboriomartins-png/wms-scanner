<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Etiquetas de Posições WMS
  </title>


  <script
    src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f3f4f6;

      color:
        #111827;

    }


    .painel {

      max-width:
        900px;

      margin:
        0 auto 25px;

      background:
        white;

      padding:
        20px;

      border-radius:
        14px;

      box-shadow:
        0 5px 20px
        rgba(
          0,
          0,
          0,
          .08
        );

    }


    .titulo {

      font-size:
        25px;

      font-weight:
        bold;

      margin-bottom:
        10px;

    }


    .descricao {

      color:
        #6b7280;

      line-height:
        1.4;

      margin-bottom:
        18px;

    }


    .resumo {

      margin-top:
        15px;

      padding:
        12px;

      background:
        #f3f4f6;

      border-radius:
        10px;

    }


    .botao {

      width:
        100%;

      height:
        52px;

      border:
        none;

      border-radius:
        10px;

      background:
        #2563eb;

      color:
        white;

      font-size:
        16px;

      font-weight:
        bold;

      cursor:
        pointer;

      margin-top:
        10px;

    }


    .botao.preto {

      background:
        #111827;

    }


    .etiquetas {

      max-width:
        900px;

      margin:
        0 auto;

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          1fr
        );

      gap:
        14px;

    }


    .etiqueta {

      background:
        white;

      border:
        1px solid
        #d1d5db;

      padding:
        16px;

      text-align:
        center;

      page-break-inside:
        avoid;

    }


    .empresa {

      font-size:
        13px;

      font-weight:
        bold;

      margin-bottom:
        5px;

    }


    .tipo {

      font-size:
        11px;

      color:
        #6b7280;

      margin-bottom:
        6px;

    }


    .codigo {

      font-size:
        30px;

      font-weight:
        bold;

      letter-spacing:
        2px;

      margin:
        5px 0;

    }


    .barcode {

      width:
        100%;

      height:
        80px;

    }


    .descricao-posicao {

      font-size:
        11px;

      color:
        #6b7280;

      margin-top:
        5px;

    }


    @media print {

      body {

        background:
          white;

        padding:
          0;

      }


      .nao-imprimir {

        display:
          none !important;

      }


      .etiquetas {

        max-width:
          none;

        grid-template-columns:
          repeat(
            2,
            1fr
          );

        gap:
          5mm;

      }


      .etiqueta {

        border:
          1px solid
          #000;

      }

    }


    @media (
      max-width:
      650px
    ) {

      .etiquetas {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>


<body>


<div
  class="painel nao-imprimir"
>

  <div class="titulo">

    Etiquetas de Posições

  </div>


  <div class="descricao">

    Gera as 360 posições físicas do WMS.

    <br><br>

    Formato:

    <strong>
      RUA + COLUNA + NÍVEL
    </strong>

    <br>

    Exemplo:

    <strong>
      B05-03
    </strong>

    = Rua B / Coluna 05 / Nível 03.

  </div>


  <div
    id="resumo"
    class="resumo"
  >

    6 ruas × 15 colunas × 4 níveis =

    <strong>
      360 posições
    </strong>

  </div>


  <button
    class="botao"
    onclick="gerarPosicoes()"
  >

    GERAR ETIQUETAS

  </button>


  <button
    class="botao preto"
    onclick="window.print()"
  >

    IMPRIMIR ETIQUETAS

  </button>

</div>


<div
  id="etiquetas"
  class="etiquetas"
></div>


<script>


/* ==========================================================
   CONFIGURAÇÃO
   ========================================================== */

const RUAS = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F"
];


const COLUNAS = 15;


const NIVEIS = 4;


/* ==========================================================
   GERAR
   ========================================================== */

function gerarPosicoes() {

  const container =
    document
      .getElementById(
        "etiquetas"
      );


  container.innerHTML =
    "";


  let contador =
    0;


  RUAS.forEach(
    function(
      rua
    ) {


      for (
        let coluna = 1;
        coluna <= COLUNAS;
        coluna++
      ) {


        for (
          let nivel = 1;
          nivel <= NIVEIS;
          nivel++
        ) {


          contador++;


          const codigo =

            rua +

            String(
              coluna
            )
            .padStart(
              2,
              "0"
            ) +

            "-" +

            String(
              nivel
            )
            .padStart(
              2,
              "0"
            );


          const etiqueta =
            document
              .createElement(
                "div"
              );


          etiqueta.className =
            "etiqueta";


          etiqueta.innerHTML =

            '<div class="empresa">' +

              'SABOR DE FRANCE' +

            '</div>' +

            '<div class="tipo">' +

              'POSIÇÃO DE ESTOQUE' +

            '</div>' +

            '<div class="codigo">' +

              codigo +

            '</div>' +

            '<svg class="barcode"></svg>' +

            '<div class="descricao-posicao">' +

              'Rua ' +
              rua +

              ' • Coluna ' +
              String(
                coluna
              )
              .padStart(
                2,
                "0"
              ) +

              ' • Nível ' +
              String(
                nivel
              )
              .padStart(
                2,
                "0"
              ) +

            '</div>';


          container.appendChild(
            etiqueta
          );


          const svg =
            etiqueta
              .querySelector(
                ".barcode"
              );


          JsBarcode(
            svg,
            codigo,
            {

              format:
                "CODE128",

              displayValue:
                true,

              text:
                codigo,

              fontSize:
                15,

              height:
                70,

              width:
                2,

              margin:
                5

            }
          );

        }

      }

    }
  );


  document
    .getElementById(
      "resumo"
    )
    .innerHTML =

      contador +
      " posições geradas.";


}


/* ==========================================================
   INICIAR
   ========================================================== */

window.addEventListener(
  "load",
  gerarPosicoes
);


</script>


</body>

</html>
