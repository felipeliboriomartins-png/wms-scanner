<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Gerador de Etiqueta WMS</title>

  <!-- Biblioteca para gerar Code 128 -->
  <script
    src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f3f4f6;

      color:
        #1f2937;

    }


    .container {

      max-width:
        700px;

      margin:
        0 auto;

    }


    .titulo {

      font-size:
        26px;

      font-weight:
        bold;

      margin-bottom:
        20px;

    }


    .painel {

      background:
        white;

      padding:
        20px;

      border-radius:
        14px;

      box-shadow:
        0 5px 20px
        rgba(
          0,
          0,
          0,
          0.08
        );

      margin-bottom:
        20px;

    }


    .campo {

      margin-bottom:
        15px;

    }


    .campo label {

      display:
        block;

      font-size:
        14px;

      font-weight:
        bold;

      margin-bottom:
        6px;

    }


    .campo input {

      width:
        100%;

      height:
        48px;

      border:
        2px solid
        #d1d5db;

      border-radius:
        10px;

      padding:
        0 12px;

      font-size:
        17px;

    }


    .linha {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        12px;

    }


    .botao {

      width:
        100%;

      height:
        50px;

      border:
        none;

      border-radius:
        10px;

      background:
        #2563eb;

      color:
        white;

      font-size:
        16px;

      font-weight:
        bold;

      cursor:
        pointer;

    }


    .botao.imprimir {

      margin-top:
        10px;

      background:
        #111827;

    }


    /* ======================================================
       ETIQUETA
       ====================================================== */

    .etiqueta {

      width:
        100%;

      max-width:
        550px;

      margin:
        0 auto;

      padding:
        25px;

      background:
        white;

      border:
        1px solid
        #d1d5db;

      text-align:
        center;

    }


    .empresa {

      font-size:
        20px;

      font-weight:
        bold;

      margin-bottom:
        10px;

    }


    .tipo {

      font-size:
        14px;

      font-weight:
        bold;

      margin-bottom:
        12px;

    }


    .codigo-pallet {

      font-size:
        30px;

      font-weight:
        bold;

      letter-spacing:
        2px;

      margin:
        10px 0;

    }


    .barcode {

      width:
        100%;

      max-width:
        450px;

      height:
        120px;

    }


    .informacoes {

      margin-top:
        15px;

      text-align:
        left;

      font-size:
        15px;

      line-height:
        1.6;

    }


    .linha-info {

      display:
        flex;

      justify-content:
        space-between;

      border-bottom:
        1px solid
        #e5e7eb;

      padding:
        4px 0;

    }


    .valor {

      font-weight:
        bold;

    }


    @media print {

      body {

        background:
          white;

        padding:
          0;

      }


      .nao-imprimir {

        display:
          none !important;

      }


      .container {

        max-width:
          none;

      }


      .etiqueta {

        border:
          none;

        box-shadow:
          none;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ======================================================
       PAINEL DE CONFIGURAÇÃO
       ====================================================== -->

  <div class="painel nao-imprimir">

    <div class="titulo">
      Gerador de Etiqueta WMS
    </div>


    <div class="campo">

      <label>
        Código do pallet
      </label>

      <input
        id="codigoPallet"
        value="PL000004"
        placeholder="Ex.: PL000001"
      >

    </div>


    <div class="linha">

      <div class="campo">

        <label>
          Produto
        </label>

        <input
          id="produto"
          value="Baguette"
        >

      </div>


      <div class="campo">

        <label>
          SKU
        </label>

        <input
          id="sku"
          value="1001"
        >

      </div>

    </div>


    <div class="linha">

      <div class="campo">

        <label>
          Lote
        </label>

        <input
          id="lote"
          value="20260808A"
        >

      </div>


      <div class="campo">

        <label>
          Quantidade
        </label>

        <input
          id="quantidade"
          value="64 UN"
        >

      </div>

    </div>


    <div class="linha">

      <div class="campo">

        <label>
          Peso
        </label>

        <input
          id="peso"
          value="17,92 kg"
        >

      </div>


      <div class="campo">

        <label>
          Tipo
        </label>

        <input
          id="tipo"
          value="FECHADO"
        >

      </div>

    </div>


    <button
      class="botao"
      onclick="gerarEtiqueta()"
    >
      GERAR ETIQUETA
    </button>


    <button
      class="botao imprimir"
      onclick="window.print()"
    >
      IMPRIMIR ETIQUETA
    </button>

  </div>


  <!-- ======================================================
       ETIQUETA
       ====================================================== -->

  <div
    id="etiqueta"
    class="etiqueta"
  >

    <div class="empresa">
      SABOR DE FRANCE
    </div>


    <div
      id="tipoEtiqueta"
      class="tipo"
    >
      PALLET FECHADO
    </div>


    <div
      id="codigoVisual"
      class="codigo-pallet"
    >
      PL000004
    </div>


    <svg
      id="barcode"
      class="barcode"
    ></svg>


    <div
      class="informacoes"
    >

      <div class="linha-info">

        <span>
          Produto:
        </span>

        <span
          id="produtoVisual"
          class="valor"
        >
          Baguette
        </span>

      </div>


      <div class="linha-info">

        <span>
          SKU:
        </span>

        <span
          id="skuVisual"
          class="valor"
        >
          1001
        </span>

      </div>


      <div class="linha-info">

        <span>
          Lote:
        </span>

        <span
          id="loteVisual"
          class="valor"
        >
          20260808A
        </span>

      </div>


      <div class="linha-info">

        <span>
          Quantidade:
        </span>

        <span
          id="quantidadeVisual"
          class="valor"
        >
          64 UN
        </span>

      </div>


      <div class="linha-info">

        <span>
          Peso:
        </span>

        <span
          id="pesoVisual"
          class="valor"
        >
          17,92 kg
        </span>

      </div>


      <div class="linha-info">

        <span>
          Tipo:
        </span>

        <span
          id="tipoVisual"
          class="valor"
        >
          FECHADO
        </span>

      </div>

    </div>

  </div>


</div>


<script>

/* ==========================================================
   GERAR ETIQUETA
   ========================================================== */

function gerarEtiqueta() {


  const codigo =
    document
      .getElementById(
        "codigoPallet"
      )
      .value
      .trim()
      .toUpperCase();


  const produto =
    document
      .getElementById(
        "produto"
      )
      .value
      .trim();


  const sku =
    document
      .getElementById(
        "sku"
      )
      .value
      .trim();


  const lote =
    document
      .getElementById(
        "lote"
      )
      .value
      .trim();


  const quantidade =
    document
      .getElementById(
        "quantidade"
      )
      .value
      .trim();


  const peso =
    document
      .getElementById(
        "peso"
      )
      .value
      .trim();


  const tipo =
    document
      .getElementById(
        "tipo"
      )
      .value
      .trim()
      .toUpperCase();


  /* ========================================================
     VALIDAÇÃO
     ======================================================== */

  if (!codigo) {

    alert(
      "Informe o código do pallet."
    );

    return;

  }


  /* ========================================================
     ATUALIZA TEXTO
     ======================================================== */

  document
    .getElementById(
      "codigoVisual"
    )
    .textContent =
    codigo;


  document
    .getElementById(
      "produtoVisual"
    )
    .textContent =
    produto;


  document
    .getElementById(
      "skuVisual"
    )
    .textContent =
    sku;


  document
    .getElementById(
      "loteVisual"
    )
    .textContent =
    lote;


  document
    .getElementById(
      "quantidadeVisual"
    )
    .textContent =
    quantidade;


  document
    .getElementById(
      "pesoVisual"
    )
    .textContent =
    peso;


  document
    .getElementById(
      "tipoVisual"
    )
    .textContent =
    tipo;


  document
    .getElementById(
      "tipoEtiqueta"
    )
    .textContent =
    tipo === "QUEBRA"
      ? "PALLET DE QUEBRA"
      : "PALLET FECHADO";


  /* ========================================================
     GERA CODE 128
     ======================================================== */

  JsBarcode(
    "#barcode",
    codigo,
    {

      format:
        "CODE128",

      displayValue:
        true,

      text:
        codigo,

      fontSize:
        20,

      fontOptions:
        "bold",

      height:
        100,

      width:
        2,

      margin:
        10,

      background:
        "#ffffff",

      lineColor:
        "#000000"

    }
  );

}


/* ==========================================================
   GERAR AO ABRIR
   ========================================================== */

window.addEventListener(
  "load",
  function() {

    gerarEtiqueta();

  }
);

</script>


</body>

</html>
